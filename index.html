<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PNR Status</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; text-align: center; }
    input, button { width: 90%; padding: 12px; margin: 8px 0; font-size: 16px; border-radius: 8px; box-sizing: border-box; }
    button { background: #2481cc; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    #result { text-align: left; margin-top: 15px; background: #f0f0f0; padding: 12px; border-radius: 8px; font-size: 13px; max-height: 350px; overflow-y: auto; }
    pre { white-space: pre-wrap; word-break: break-all; margin: 0; }
  </style>
</head>
<body>
  <h3>Enter PNR</h3>
  <input type="number" id="pnrInput" placeholder="Enter 10-digit PNR">
  <button onclick="fetchStatus()">Get Details</button>
  <div id="result" style="display:none;"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    async function fetchStatus() {
      const pnr = document.getElementById("pnrInput").value.trim();
      const resBox = document.getElementById("result");

      if (pnr.length !== 10) {
        alert("Please enter a valid 10-digit PNR.");
        return;
      }

      resBox.style.display = "block";
      resBox.innerHTML = "Fetching status...";

      try {
        const response = await fetch("https://apigw.umangapp.in/CRISApi/ws1/nget/pnrStatusPlusMaster", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Deptid": "100014",
            "Srvid": "1967",
            "Formtrkr": "0"
          },
          body: JSON.stringify({
            deptid: "100014",
            formtrkr: "0",
            lang: "en",
            language: "en",
            mode: "web",
            pltfrm: "android",
            pnrEnqType: "ALL",
            pnrnumber: String(pnr),
            srvid: "1967",
            subsid: "0",
            subsid2: "0",
            tkn: "",
            usrid: ""
          })
        });

        const data = await response.json();
        resBox.innerHTML = "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
      } catch (err) {
        resBox.innerHTML = "<span style='color:red;'>Network/CORS Error: " + err.message + "</span>";
      }
    }
  </script>
</body>
</html>
