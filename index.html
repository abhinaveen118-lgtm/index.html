      <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PNR Status</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; padding: 25px; text-align: center; }
    input { width: 85%; padding: 12px; margin: 15px 0; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
    button { background: #2481cc; color: white; border: none; padding: 12px; width: 85%; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h3>Enter 10-digit PNR</h3>
  <input type="number" id="pnr" placeholder="e.g. 8752463552">
  <br>
  <button onclick="openStatus()">View Status</button>

  <script>
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();

    function openStatus() {
      const pnr = document.getElementById("pnr").value.trim();
      if (pnr.length !== 10) {
        alert("Please enter a valid 10-digit PNR number.");
        return;
      }
      // Redirect straight to Umang's pre-rendered status page
      window.location.href = "https://web.umang.gov.in/rail_nget/service/1967/info?pnrNo=" + pnr;
    }
  </script>
</body>
</html>
