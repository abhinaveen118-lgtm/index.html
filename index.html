<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PNR Checker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; text-align: center; }
    input, button { padding: 10px; font-size: 16px; margin: 10px 0; width: 85%; }
    #result { text-align: left; margin-top: 20px; background: #eee; padding: 15px; border-radius: 8px; }
  </style>
</head>
<body>
  <h3>Enter PNR</h3>
  <input type="number" id="pnr" placeholder="10-digit PNR">
  <button onclick="checkStatus()">Get Details</button>
  <div id="result" style="display:none;"></div>

  <script>
    window.Telegram.WebApp.ready();

    async function checkStatus() {
      const pnr = document.getElementById("pnr").value;
      const resBox = document.getElementById("result");
      
      if (pnr.length !== 10) {
        alert("Enter a valid 10-digit PNR");
        return;
      }

      resBox.style.display = "block";
      resBox.innerText = "Loading details...";

      try {
        const response = await fetch("https://apigw.umangapp.in/CRISApi/ws1/nget/pnrStatusPlusMaster", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Deptid": "100014",
            "Srvid": "1967",
            "Formtrkr": "0"
          },
          body: JSON.stringify({
            deptid: "100014",
            formtrkr: "0",
            lang: "en",
            language: "en",
            mode: "web",
            pltfrm: "android",
            pnrEnqType: "ALL",
            pnrnumber: String(pnr),
            srvid: "1967",
            subsid: "0",
            subsid2: "0",
            tkn: "",
            usrid: ""
          })
        });

        const data = await response.json();
        resBox.innerHTML = `<b>Train:</b> ${data.trainNumber || 'N/A'}<br><b>Date:</b> ${data.journeyDate || 'N/A'}`;
      } catch (err) {
        resBox.innerText = "Error: Browser blocked request (CORS/WAF) or invalid response.";
      }
    }
  </script>
</body>
</html>
